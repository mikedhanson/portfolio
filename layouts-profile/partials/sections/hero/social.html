<span>
    {{ range .Site.Params.hero.socialLinks.fontAwesomeIcons }}
    <span class="px-1">
        <a href="{{ .url }}" aria-label="{{ .name | default .url }}" class="btn social-icon">
            <i class="{{ .icon }}" aria-hidden="true"></i>
        </a>
    </span>
    {{ end }}

    {{ range .Site.Params.hero.socialLinks.customIcons }}
    <span class="px-1">
        <a href="{{ .url }}" aria-label="{{ .name | default .url }}" class="btn social-icon">
            <img src="{{ .icon }}" alt="">
        </a>
    </span>
    {{ end }}
</span>
